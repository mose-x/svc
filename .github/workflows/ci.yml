name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs for the same ref when a new commit is pushed,
# so we don't waste CI minutes on superseded PR commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '18'
  # Pure-Go build: Wails CGO (webview) is exercised by build.yml on tag
  # releases. CI uses CGO_ENABLED=0 for fast, dependency-free feedback
  # across all three OSes without GTK/webkit dev packages.
  CGO_ENABLED: '0'

jobs:
  # Lint runs once on Linux: gofmt + go vet are platform-independent and
  # running them 3x would just burn CI minutes.
  lint:
    name: fmt + vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do bash -n "$f" || exit 1; done

  # Tests + build run on all three OSes so Windows-specific code paths
  # (registry PATH, path_windows.go) and macOS get real regression
  # coverage instead of only cross-compiling.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test ./...

  # commit-lint: enforce commit message + identity rules on every PR commit.
  # Reuses the code-hooks repo's hooks as the single source of truth:
  #   - `commit-msg` hook: subject/conventional/ASCII/length/forbidden-token rules
  #   - identity check: author+committer email allowlist from hook-rules.conf [identities]
  #   - annotated tag validation (tagger email + ASCII + forbidden tokens)
  # code-hooks is public -> unauthenticated HTTPS clone, no secrets/deploy key.
  # Squash merges generated on GitHub bypass local hooks; this is the CI backstop.
  # Set branch protection to require `commit-lint / commit-lint` on the
  # protected branch -- the only layer `--no-verify` cannot bypass.
  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    # TODO: pin to @v1.x.x when code-hooks publishes a tag
    # pinned 2026-08-21 (code-hooks main HEAD; verify before bumping)
    uses: mose-x/code-hooks/.github/workflows/commit-lint.yml@5640e50ef5d61b70a44560e0abd949fdb0f0820c
